name: Update EPG

on:
  schedule:
    - cron: '0 */12 * * *'   # every 12 hours at minute 0
  workflow_dispatch:           # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync with latest main
        run: |
          git config user.name "EPG Bot"
          git config user.email "epg-bot@prdigitaltv.com"
          git pull --rebase origin main

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh DINO active channel IDs
        env:
          PROVIDER_EPG_URL_2: ${{ secrets.PROVIDER_EPG_URL_2 }}
        run: |
          python3 - <<'EOF'
          import os, re, json, urllib.request
          url2 = os.environ.get('PROVIDER_EPG_URL_2', '')
          m = re.search(r'username=([^&]+).*password=([^&]+)', url2)
          if not m:
              print('WARN: Cannot parse DINO credentials, skipping refresh')
              exit(0)
          user, pwd = m.group(1), m.group(2)
          host_m = re.match(r'https?://([^/]+)', url2)
          host = host_m.group(1) if host_m else 'line.host-prdigital.cc'
          api = f'http://{host}/player_api.php?username={user}&password={pwd}&action=get_live_streams'
          print(f'Fetching DINO stream list from {host}...')
          try:
              with urllib.request.urlopen(api, timeout=30) as r:
                  streams = json.loads(r.read().decode('utf-8', errors='ignore'))
              ids = sorted(set(
                  s['epg_channel_id'].strip()
                  for s in streams
                  if s.get('epg_channel_id') and isinstance(s['epg_channel_id'], str) and s['epg_channel_id'].strip()
              ))
              with open('config/provider2-epg-ids.json', 'w') as f:
                  json.dump(ids, f)
              print(f'Saved {len(ids)} active DINO channel IDs')
          except Exception as e:
              print(f'WARN: Failed to refresh DINO IDs: {e} (using existing file)')
          EOF

      - name: Run EPG pipeline
        env:
          PROVIDER_EPG_URL: ${{ secrets.PROVIDER_EPG_URL }}
          PROVIDER_EPG_URL_2: ${{ secrets.PROVIDER_EPG_URL_2 }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node src/index.js | tee /tmp/epg-pipeline.log
          CH=$(grep -oP 'After filter: \K[0-9]+(?= channels)' /tmp/epg-pipeline.log | tail -1)
          PR=$(grep -oP 'After purge: \K[0-9]+(?= programmes)' /tmp/epg-pipeline.log | tail -1)
          echo "EPG_CHANNELS=${CH:-?}" >> $GITHUB_ENV
          echo "EPG_PROGRAMMES=${PR:-?}" >> $GITHUB_ENV

      - name: Commit updated EPG
        run: |
          cp output/epg.xml epg.xml
          git add -u
          git add epg.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update epg.xml [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push || (git pull --rebase origin main && git push)
          fi

      - name: Notify admin via GHL SMS
        if: success()
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
        run: |
          TS=$(date -u '+%Y-%m-%d %H:%M UTC')
          MSG="✅ EPG PRDigitalTV actualizado en GitHub Pages. Canales: ${{ env.EPG_CHANNELS }} | Programas: ${{ env.EPG_PROGRAMMES }} | $TS"
          echo "Sending SMS notification..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://services.leadconnectorhq.com/conversations/messages" \
            -H "Authorization: Bearer $GHL_API_KEY" \
            -H "Version: 2021-07-28" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"SMS\",\"contactId\":\"25gHD3dCGOCNf7ZrqxUq\",\"message\":\"$MSG\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP $HTTP_CODE: $BODY"
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "WARNING: SMS notification failed with HTTP $HTTP_CODE (non-blocking)"
          fi
