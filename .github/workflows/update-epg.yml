name: Update EPG

on:
  schedule:
    - cron: '0 */12 * * *'   # every 12 hours at minute 0
  workflow_dispatch:           # allow manual trigger from GitHub UI

permissions:
  contents: write
  pages: write      # deploy the gzipped EPG to Pages without committing it
  id-token: write

concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync with latest main
        run: |
          git config user.name "EPG Bot"
          git config user.email "epg-bot@prdigitaltv.com"
          git pull --rebase origin main

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore previous EPG to output/
        run: |
          mkdir -p output
          # The gzipped EPG is not stored in git; the live Pages copy is the fallback if every provider fails this run
          B=https://figu6378-max.github.io/prdigitaltv-epg
          curl -fsSL "$B/epg.xml.gz"  | gunzip > output/epg.xml  || rm -f output/epg.xml
          curl -fsSL "$B/epg2.xml.gz" | gunzip > output/epg2.xml || rm -f output/epg2.xml

      - name: Refresh DINO active channel IDs
        env:
          PROVIDER_EPG_URL_2: ${{ secrets.PROVIDER_EPG_URL_2 }}
        run: |
          python3 - <<'EOF'
          import os, re, json, urllib.request
          url2 = os.environ.get('PROVIDER_EPG_URL_2', '')
          m = re.search(r'username=([^&]+).*password=([^&]+)', url2)
          if not m:
              print('WARN: Cannot parse DINO credentials, skipping refresh')
              exit(0)
          user, pwd = m.group(1), m.group(2)
          host_m = re.match(r'https?://([^/]+)', url2)
          host = host_m.group(1) if host_m else 'line.host-prdigital.cc'
          api = f'http://{host}/player_api.php?username={user}&password={pwd}&action=get_live_streams'
          print(f'Fetching DINO stream list from {host}...')
          try:
              with urllib.request.urlopen(api, timeout=30) as r:
                  streams = json.loads(r.read().decode('utf-8', errors='ignore'))
              ids = sorted(set(
                  s['epg_channel_id'].strip()
                  for s in streams
                  if s.get('epg_channel_id') and isinstance(s['epg_channel_id'], str) and s['epg_channel_id'].strip()
              ))
              with open('config/provider2-epg-ids.json', 'w') as f:
                  json.dump(ids, f)
              print(f'Saved {len(ids)} active DINO channel IDs')
          except Exception as e:
              print(f'WARN: Failed to refresh DINO IDs: {e} (using existing file)')
          EOF

      - name: Run EPG pipeline
        env:
          PROVIDER_EPG_URL: ${{ secrets.PROVIDER_EPG_URL }}
          PROVIDER_EPG_URL_2: ${{ secrets.PROVIDER_EPG_URL_2 }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -o pipefail
          node src/index.js 2>&1 | tee /tmp/epg-pipeline.log
          P1_CH=$(grep -oP 'epg\.xml written — \K[0-9]+(?= channels)' /tmp/epg-pipeline.log | tail -1)
          P1_PR=$(grep -oP 'epg\.xml written — [0-9]+ channels, \K[0-9]+(?= programmes)' /tmp/epg-pipeline.log | tail -1)
          P2_CH=$(grep -oP 'epg2\.xml written — \K[0-9]+(?= channels)' /tmp/epg-pipeline.log | tail -1)
          P2_PR=$(grep -oP 'epg2\.xml written — [0-9]+ channels, \K[0-9]+(?= programmes)' /tmp/epg-pipeline.log | tail -1)
          echo "EPG_P1_CHANNELS=${P1_CH:-?}" >> $GITHUB_ENV
          echo "EPG_P1_PROGRAMMES=${P1_PR:-?}" >> $GITHUB_ENV
          echo "EPG_P2_CHANNELS=${P2_CH:-?}" >> $GITHUB_ENV
          echo "EPG_P2_PROGRAMMES=${P2_PR:-?}" >> $GITHUB_ENV

      - name: Show pipeline log tail on failure
        if: failure()
        run: tail -80 /tmp/epg-pipeline.log || true

      - name: Commit updated config
        run: |
          # Raw and gzipped EPG files must stay out of git (~60 MB per run); drop any left from earlier versions
          git rm -q -f --ignore-unmatch epg.xml epg2.xml epg.xml.gz epg2.xml.gz
          git add -u
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update epg config [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push || (git pull --rebase origin main && git push)
          fi

      - name: Build Pages site
        run: |
          mkdir -p _site
          # -n keeps the gzip header free of timestamps
          gzip -9 -n -c output/epg.xml  > _site/epg.xml.gz
          gzip -9 -n -c output/epg2.xml > _site/epg2.xml.gz
          cp stream-epg-map.json _site/
          ls -l _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Notify admin via GHL SMS on failure
        if: failure()
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
        run: |
          TS=$(date -u '+%Y-%m-%d %H:%M UTC')
          MSG="❌ EPG PRDigitalTV FALLO en actualizacion. Revisar GitHub Actions. | $TS"
          echo "Sending SMS notification..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://services.leadconnectorhq.com/conversations/messages" \
            -H "Authorization: Bearer $GHL_API_KEY" \
            -H "Version: 2021-07-28" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"SMS\",\"contactId\":\"25gHD3dCGOCNf7ZrqxUq\",\"message\":\"$MSG\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP $HTTP_CODE: $BODY"
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "WARNING: SMS notification failed with HTTP $HTTP_CODE (non-blocking)"
          fi
