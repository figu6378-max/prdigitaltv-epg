name: Update EPG

on:
  schedule:
    - cron: '0 */12 * * *'   # every 12 hours at minute 0
  workflow_dispatch:           # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run EPG pipeline
        env:
          PROVIDER_EPG_URL: ${{ secrets.PROVIDER_EPG_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node src/index.js

      - name: Commit updated EPG
        run: |
          git config user.name "EPG Bot"
          git config user.email "epg-bot@prdigitaltv.com"
          cp output/epg.xml epg.xml
          git add epg.xml
          if git diff --staged --quiet; then
            echo "No changes to epg.xml"
          else
            git commit -m "chore: update epg.xml [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
