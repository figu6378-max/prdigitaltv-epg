name: Update EPG

on:
  schedule:
    - cron: '0 */12 * * *'   # every 12 hours at minute 0
  workflow_dispatch:           # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync with latest main
        run: |
          git config user.name "EPG Bot"
          git config user.email "epg-bot@prdigitaltv.com"
          git pull --rebase origin main

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run EPG pipeline
        env:
          PROVIDER_EPG_URL: ${{ secrets.PROVIDER_EPG_URL }}
          PROVIDER_EPG_URL_2: ${{ secrets.PROVIDER_EPG_URL_2 }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node src/index.js

      - name: Commit updated EPG
        run: |
          cp output/epg.xml epg.xml
          git add epg.xml
          if git diff --staged --quiet; then
            echo "No changes to epg.xml"
          else
            git commit -m "chore: update epg.xml [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push || (git pull --rebase origin main && git push)
          fi

      - name: Notify admin via GHL SMS
        if: success()
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
        run: |
          TS=$(date -u '+%Y-%m-%d %H:%M UTC')
          MSG="✅ EPG PRDigitalTV actualizado en GitHub Pages. Canales: 496 | Programas: ~28k | $TS"
          echo "Sending SMS notification..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://services.leadconnectorhq.com/conversations/messages" \
            -H "Authorization: Bearer $GHL_API_KEY" \
            -H "Version: 2021-07-28" \
            -H "Content-Type: application/json" \
            -d "{\"type\":\"SMS\",\"contactId\":\"25gHD3dCGOCNf7ZrqxUq\",\"message\":\"$MSG\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP $HTTP_CODE: $BODY"
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "WARNING: SMS notification failed with HTTP $HTTP_CODE (non-blocking)"
          fi
