name: Discover Channels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run discovery
        env:
          PROVIDER_EPG_URL: ${{ secrets.PROVIDER_EPG_URL }}
        run: node src/index.js --discover

      - name: Commit discovered channels
        run: |
          git config user.name "EPG Bot"
          git config user.email "epg-bot@prdigitaltv.com"
          git add -f config/channels-discovered.json
          if git diff --staged --quiet; then
            echo "No changes to channels-discovered.json"
          else
            git commit -m "chore: update channels-discovered.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
